<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogScore — Bienvenida</title>
    <style>
        :root {
            --ls-blue-vibrant: #0066FF;
            --ls-blue-dark: #0052CC;
            --ls-blue-light: #EBF3FF;
            --ls-orange-vibrant: #FF5E36;
            --ls-purple-vibrant: #8B5CF6;
            --ls-purple-light: #F3E8FF;
            --ls-green-vibrant: #10B981;
            --ls-green-light: #ECFDF5;

            --ls-text-main: #0F172A;
            --ls-text-sub: #64748B;
            --ls-bg-screen: #F8FAFC;
            --ls-border-soft: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ls-text-main);
            background: var(--ls-bg-screen);
            -webkit-font-smoothing: antialiased;
        }

        .screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--ls-bg-screen);
            position: relative;
            overflow: hidden;
        }

        /* ─── Status bar ─── */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 22px 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--ls-text-main);
        }
        .status-bar .icons { letter-spacing: 2px; }

        /* ─── Top bar ─── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px 8px;
        }
        .top-bar .icon-btn {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--ls-text-sub);
            background: transparent;
            border: none;
        }
        .top-bar .step {
            font-size: 11px;
            font-weight: 800;
            color: var(--ls-text-sub);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        /* ─── Progress ─── */
        .steps {
            display: flex;
            gap: 6px;
            margin: 2px 20px 14px;
            flex-shrink: 0;
        }
        .step-seg {
            height: 5px;
            flex: 1;
            background: var(--ls-border-soft);
            border-radius: 10px;
            transition: background 0.3s;
        }
        .step-seg.active { background: var(--ls-blue-vibrant); }

        /* ─── Contenido ─── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 16px;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }

        /* ─── Mascota / Ilustración ─── */
        .mascot-wrap {
            display: flex;
            justify-content: center;
            margin: 4px 0 10px;
            position: relative;
        }
        .mascot {
            width: 150px;
            height: 150px;
            position: relative;
        }

        /* Sombra suave bajo la mascota */
        .mascot::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 10px;
            background: radial-gradient(ellipse, rgba(15,23,42,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .mascot svg { width: 100%; height: 100%; display: block; }

        /* ─── Hero título + eslogan ─── */
        .hero-title {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.18;
            letter-spacing: -0.6px;
            color: var(--ls-text-main);
            margin-bottom: 8px;
            text-align: center;
        }
        .hero-title em {
            font-style: normal;
            background: linear-gradient(135deg, var(--ls-blue-vibrant), var(--ls-purple-vibrant));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-sub {
            font-size: 12.5px;
            color: var(--ls-text-sub);
            line-height: 1.45;
            margin-bottom: 18px;
            font-weight: 500;
            text-align: center;
            padding: 0 6px;
        }

        /* ─── Sección ─── */
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 4px 0 10px;
        }
        .section-head h4 {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--ls-text-sub);
        }
        .section-head .optional {
            font-size: 10px;
            font-weight: 700;
            color: var(--ls-text-sub);
            letter-spacing: 0.2px;
        }

        /* ─── Chips de objetivo (Selección única) ─── */
        .chips {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: #FFFFFF;
            border: 1.5px solid var(--ls-border-soft);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            font-family: inherit;
            text-align: left;
            width: 100%;
        }
        .chip:hover { border-color: #93C5FD; }
        .chip.selected {
            border-color: var(--ls-blue-vibrant);
            background: linear-gradient(180deg, #FFFFFF 0%, #F7FAFF 100%);
            box-shadow: 0 0 0 3px rgba(0,102,255,0.12);
        }

        .chip-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: var(--ls-blue-light);
            color: var(--ls-blue-vibrant);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .chip.selected .chip-icon {
            background: var(--ls-blue-vibrant);
            color: #FFFFFF;
        }
        .chip-icon svg { width: 18px; height: 18px; }

        .chip-body { flex: 1; min-width: 0; }
        .chip-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--ls-text-main);
            letter-spacing: -0.2px;
            margin-bottom: 1px;
        }
        .chip-desc {
            font-size: 10.5px;
            color: var(--ls-text-sub);
            line-height: 1.3;
            font-weight: 500;
        }

        .chip-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid var(--ls-border-soft);
            flex-shrink: 0;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }
        .chip.selected .chip-check {
            background: var(--ls-blue-vibrant);
            border-color: var(--ls-blue-vibrant);
        }
        .chip-check svg {
            width: 11px;
            height: 11px;
            color: #FFFFFF;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .chip.selected .chip-check svg { opacity: 1; }

        /* ─── Ocupación ─── */
        .field-group {
            margin-bottom: 18px;
        }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--ls-text-sub);
            margin-bottom: 8px;
        }

        .select-wrap {
            position: relative;
        }
        .select-wrap select {
            width: 100%;
            padding: 13px 40px 13px 14px;
            background: #FFFFFF;
            border: 1.5px solid var(--ls-border-soft);
            border-radius: 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--ls-text-main);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color 0.2s;
            outline: none;
        }
        .select-wrap select:focus {
            border-color: var(--ls-blue-vibrant);
            box-shadow: 0 0 0 3px rgba(0,102,255,0.12);
        }
        .select-wrap select.placeholder {
            color: var(--ls-text-sub);
            font-weight: 500;
        }
        .select-chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--ls-text-sub);
        }
        .select-chevron svg { width: 14px; height: 14px; }

        /* ─── CTA fija ─── */
        .footer-cta {
            padding: 12px 20px 20px;
            background: linear-gradient(180deg, rgba(248,250,252,0) 0%, var(--ls-bg-screen) 40%);
            flex-shrink: 0;
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 15px 20px;
            background: linear-gradient(135deg, var(--ls-blue-vibrant) 0%, var(--ls-blue-dark) 100%);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 24px -6px rgba(0, 102, 255, 0.5);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -6px rgba(0,102,255,0.55); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .cta-sub {
            text-align: center;
            font-size: 10px;
            color: var(--ls-text-sub);
            margin-top: 10px;
            font-weight: 600;
            line-height: 1.4;
        }
        .cta-sub a {
            color: var(--ls-blue-vibrant);
            text-decoration: none;
            font-weight: 800;
        }

        /* ─── Home indicator ─── */
        .home-indicator {
            width: 120px;
            height: 4px;
            background: #CBD5E1;
            border-radius: 999px;
            margin: 8px auto 0;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="screen">

        <!-- Status bar -->
        <div class="status-bar">
            <span>9:41</span>
            <span class="icons">•••  ᯤ  ▮</span>
        </div>

        <!-- Top bar -->
        <div class="top-bar">
            <button class="icon-btn" aria-label="Atrás" id="backBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <span class="step">Paso 1 de 4</span>
            <button class="icon-btn" aria-label="Ayuda">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/>
                    <circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/>
                </svg>
            </button>
        </div>

        <!-- Progress -->
        <div class="steps">
            <div class="step-seg active"></div>
            <div class="step-seg"></div>
            <div class="step-seg"></div>
            <div class="step-seg"></div>
        </div>

        <!-- Contenido -->
        <div class="content">

            <!-- Mascota: cerdito alcancía -->
            <div class="mascot-wrap">
                <div class="mascot">
                    <img src="../assets/cerdito.png" height="100%">
                </div>
            </div>

            <!-- Título -->
            <h1 class="hero-title">
                Construye tu <em>reputación crediticia</em> con tus hábitos cotidianos
            </h1>
            <p class="hero-sub">
                Cuéntanos un poco de ti para personalizar tu experiencia.
            </p>

            <!-- Sección: Objetivo principal -->
            <div class="section-head">
                <h4>¿Cuál es tu objetivo principal?</h4>
            </div>

            <div class="chips" id="goalChips" role="radiogroup" aria-label="Objetivo principal">
                <button class="chip" data-goal="first" role="radio" aria-checked="false">
                    <span class="chip-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="6" width="20" height="14" rx="3"/>
                            <path d="M2 10h20"/>
                            <path d="M6 15h4"/>
                        </svg>
                    </span>
                    <span class="chip-body">
                        <span class="chip-title">Mi primer crédito</span>
                        <span class="chip-desc">Empieza a construir historial desde cero.</span>
                    </span>
                    <span class="chip-check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12l5 5L20 7"/>
                        </svg>
                    </span>
                </button>

                <button class="chip" data-goal="debt" role="radio" aria-checked="false">
                    <span class="chip-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18"/>
                            <path d="M7 15l4-4 4 4 5-6"/>
                        </svg>
                    </span>
                    <span class="chip-body">
                        <span class="chip-title">Salir de deudas</span>
                        <span class="chip-desc">Ordena tus finanzas y recupera el control.</span>
                    </span>
                    <span class="chip-check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12l5 5L20 7"/>
                        </svg>
                    </span>
                </button>

                <button class="chip" data-goal="save" role="radio" aria-checked="false">
                    <span class="chip-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </span>
                    <span class="chip-body">
                        <span class="chip-title">Ahorrar para una meta</span>
                        <span class="chip-desc">Construye un colchón para lo que viene.</span>
                    </span>
                    <span class="chip-check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12l5 5L20 7"/>
                        </svg>
                    </span>
                </button>
            </div>

            <!-- Sección: Ocupación -->
            <div class="field-group">
                <label class="field-label" for="occupation">Ocupación básica</label>
                <div class="select-wrap">
                    <select id="occupation" class="placeholder" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="student">Estudiante universitario</option>
                        <option value="freelance">Trabajador independiente</option>
                        <option value="employee">Empleado formal</option>
                        <option value="entrepreneur">Emprendedor</option>
                        <option value="other">Otro</option>
                    </select>
                    <span class="select-chevron">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </span>
                </div>
            </div>

        </div>

        <!-- CTA fija -->
        <div class="footer-cta">
            <button class="btn-primary" id="startBtn" disabled>
                ¡Vamos allá!
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="M13 5l7 7-7 7"/>
                </svg>
            </button>
            <p class="cta-sub">
                Al continuar aceptas los <a href="#">Términos</a> y el <a href="#">Aviso de Privacidad</a>.
            </p>
            <div class="home-indicator"></div>
        </div>

    </div>

    <script>
        // ─── Estado del formulario ───
        let selectedGoal = null;
        let selectedOccupation = '';

        const startBtn = document.getElementById('startBtn');

        // ─── Chips de objetivo (selección única) ───
        document.querySelectorAll('#goalChips .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const isSelected = chip.classList.contains('selected');

                // Quitar selección de todos
                document.querySelectorAll('#goalChips .chip').forEach(c => {
                    c.classList.remove('selected');
                    c.setAttribute('aria-checked', 'false');
                });

                if (!isSelected) {
                    chip.classList.add('selected');
                    chip.setAttribute('aria-checked', 'true');
                    selectedGoal = chip.dataset.goal;
                } else {
                    selectedGoal = null;
                }

                updateCTA();
            });
        });

        // ─── Select de ocupación ───
        const occupationSelect = document.getElementById('occupation');
        occupationSelect.addEventListener('change', (e) => {
            selectedOccupation = e.target.value;
            // Quitar clase placeholder una vez que el usuario elige
            occupationSelect.classList.toggle('placeholder', !selectedOccupation);
            updateCTA();
        });

        // ─── Habilitar CTA solo cuando el form esté completo ───
        function updateCTA() {
            startBtn.disabled = !(selectedGoal && selectedOccupation);
        }

        // ─── Confirmar → Page2 (Centro de Consentimiento) ───
        startBtn.addEventListener('click', () => {
            if (!selectedGoal || !selectedOccupation) return;
            // Persistir la selección por si más adelante la necesitas
            try {
                sessionStorage.setItem('ls_profile', JSON.stringify({
                    goal: selectedGoal,
                    occupation: selectedOccupation
                }));
            } catch (e) { /* noop */ }

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'navigate', screen: 2 }, '*');
            }
        });

        // ─── Botón atrás: no hay pantalla previa en el flujo, se deja sin acción ───
        document.getElementById('backBtn').addEventListener('click', () => {
            // Podría cerrar el demo o volver al viewer;
            // por ahora, no hace nada.
        });
    </script>
</body>
</html>
