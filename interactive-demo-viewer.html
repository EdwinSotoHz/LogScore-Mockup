<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogScore — Demo Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            /* Fondo azul claro degradado inspirado en la imagen */
            background: linear-gradient(135deg, #e0f0fe 0%, #cce5ff 50%, #b8dcff 100%);
            color: #1e293b;
        }

        /* Layout de 2 columnas */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            height: 100vh;
            padding: 2rem 4rem;
            gap: 3rem;
            overflow: hidden;
        }

        /* Columna izquierda (info) */
        .info {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 520px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(37, 99, 235, 0.2);
            width: fit-content;
        }

        .brand-title {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .info h1 {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            line-height: 1.1;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .info h1 span {
            color: #2563eb;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-top: 0.6rem;
        }

        .info p {
            color: #334155;
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .team-tag {
            font-size: 0.95rem;
            color: #475569;
        }

        .team-tag strong {
            color: #0f172a;
        }

        /* Controles del viewer */
        .controls {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.3rem;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.6);
            color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        /* Selector de pantallas */
        .screen-selector {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .screen-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #334155;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .screen-dot:hover {
            background: rgba(37, 99, 235, 0.15);
            color: #2563eb;
        }

        .screen-dot.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        /* Columna derecha: phone */
        .phone-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            overflow: hidden;
        }

        /* Marco del teléfono */
        .phone-frame {
            --phone-h: min(90vh, 780px);
            width: calc(var(--phone-h) * 0.4615);
            height: var(--phone-h);
            background: #0f172a;
            border-radius: calc(var(--phone-h) * 0.06);
            padding: calc(var(--phone-h) * 0.014);
            box-shadow:
                0 25px 50px -12px rgba(15, 23, 42, 0.25),
                0 0 0 2px rgba(255, 255, 255, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            flex-shrink: 0;
        }

        /* Botones laterales */
        .phone-frame::before,
        .phone-frame::after {
            content: '';
            position: absolute;
            width: 3px;
            background: #1e293b;
            border-radius: 2px;
        }

        .phone-frame::before {
            top: 18%;
            right: -3px;
            height: 12%;
        }

        .phone-frame::after {
            top: 16%;
            left: -3px;
            height: 6%;
        }

        /* Notch / Dynamic Island */
        .phone-notch {
            position: absolute;
            top: calc(var(--phone-h) * 0.014 + 6px);
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            height: calc(var(--phone-h) * 0.032);
            background: #000;
            border-radius: 999px;
            z-index: 20;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: calc(var(--phone-h) * 0.048);
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responsive */
        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            html,
            body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .hero {
                min-height: 100vh;
                height: auto;
                grid-template-columns: 1fr;
                padding: 5.5rem 1rem 2rem;
                gap: 1.5rem;
                overflow: visible;
            }

            .info {
                width: 100%;
                max-width: none;
                text-align: center;
                align-items: center;
                gap: 0.85rem;
            }

            .badge {
                font-size: 0.72rem;
                padding: 0.35rem 0.75rem;
            }

            .brand-title {
                justify-content: center;
            }

            .info h1 {
                font-size: clamp(2rem, 10vw, 2.8rem);
            }

            .subtitle {
                font-size: 0.72rem;
                margin-top: 0.35rem;
            }

            .info p {
                max-width: 340px;
                font-size: 0.9rem;
                line-height: 1.45;
            }

            .team-tag {
                font-size: 0.8rem;
            }

            .controls {
                width: 100%;
                max-width: 360px;
                justify-content: center;
                gap: 0.5rem;
                margin-top: 0.25rem;
            }

            .btn {
                padding: 0.65rem 0.9rem;
                font-size: 0.78rem;
                flex: 1 1 auto;
            }

            .screen-selector {
                justify-content: center;
                margin-top: 0.15rem;
            }

            .screen-dot {
                width: 32px;
                height: 32px;
            }

            .phone-wrapper {
                width: 100%;
                height: auto;
                min-height: 0;
                overflow: visible;
                align-items: flex-start;
            }

            .phone-frame {
                /* El teléfono ocupa casi todo el ancho disponible */
                --phone-w: min(82vw, 390px);
                width: var(--phone-w);
                height: calc(var(--phone-w) / 0.4615);
                padding: calc(var(--phone-w) * 0.0303);
                border-radius: calc(var(--phone-w) * 0.13);
            }

            .phone-notch {
                top: calc(var(--phone-w) * 0.0303 + 5px);
                height: calc(var(--phone-w) * 0.0693);
            }

            .phone-screen {
                border-radius: calc(var(--phone-w) * 0.104);
            }

            .phone-frame::before,
            .phone-frame::after {
                width: 2px;
            }
        }

        @media (max-width: 420px) {
            .hero {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
                padding-top: 5rem;
                gap: 1.25rem;
            }

            .info h1 {
                font-size: 2.15rem;
            }

            .info p {
                font-size: 0.84rem;
                max-width: 310px;
            }

            .controls {
                max-width: 330px;
            }

            .btn {
                padding: 0.6rem 0.65rem;
                font-size: 0.72rem;
            }

            .phone-frame {
                --phone-w: min(86vw, 360px);
            }
        }

        @media (max-height: 700px) and (min-width: 901px) {
            .phone-frame {
                --phone-h: min(88vh, 620px);
            }

            .info h1 {
                font-size: 1.8rem;
            }

            .info p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <!-- Info del producto -->
        <div class="info">
            <span class="badge">✦ Prototipo interactivo</span>
            <div>
                <h1>Log<span>Score</span></h1>
                <div class="subtitle">Diario Financiero</div>
            </div>

            <p>Un diario financiero que no confía en lo que prometes, sino en lo que demuestras.</p>

            <div class="team-tag">
                <strong>Equipo:</strong> ITICsLab
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="loadScreen(currentScreen + 1)">
                    ▶ Siguiente
                </button>
                <button class="btn btn-ghost" onclick="loadScreen(currentScreen - 1)">
                    ◀ Anterior
                </button>
                <button class="btn btn-ghost" onclick="resetDemo()">
                    ↺ Reiniciar
                </button>
            </div>

            <div class="screen-selector" id="screenSelector">
                <!-- generados por JS -->
            </div>
        </div>

        <!-- Marco del teléfono -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe id="appScreen" src="mobile-app-mockup/page1.html" scrolling="no" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </section>

    <script>
        const iframe = document.getElementById('appScreen');
        const selector = document.getElementById('screenSelector');

        const screens = [
            { n: 1, title: 'Onboarding' },
            { n: 2, title: 'Dashboard' },
            { n: 3, title: 'Registro Conversacional & Escanner' },
            { n: 4, title: 'Dashboard' },
            { n: 5, title: 'Dashboard' },
            { n: 6, title: 'Dashboard' }
        ];

        let currentScreen = 1;

        // Renderizar botones de pantalla
        screens.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'screen-dot';
            btn.textContent = s.n;
            btn.title = s.title;
            btn.onclick = () => loadScreen(s.n);
            selector.appendChild(btn);
        });

        function loadScreen(n) {
            if (n < 1 || n > screens.length) return;
            currentScreen = n;
            iframe.src = `mobile-app-mockup/page${n}.html`;
            updateActiveDot();
        }

        function resetDemo() {
            loadScreen(1);
        }

        function updateActiveDot() {
            document.querySelectorAll('.screen-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === currentScreen);
            });
        }

        // Escuchar navegación desde las pantallas
        window.addEventListener('message', (e) => {
            if (e.data && e.data.action === 'navigate') {
                loadScreen(e.data.screen);
            }
        });

        // Inicializar
        updateActiveDot();

        // Navegación con flechas del teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') loadScreen(currentScreen + 1);
            if (e.key === 'ArrowLeft') loadScreen(currentScreen - 1);
        });
    </script>
</body>

</html>
