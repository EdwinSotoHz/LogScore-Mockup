<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogScore — Demo Interactivo</title>
    <link rel="icon" type="image/png" href="assets/icon.ico">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/movile-viewer.css">
</head>

<body>
    <section class="hero">
        <!-- Info del producto -->
        <div class="info">
            <span class="badge">✦ Prototipo interactivo</span>
            <div>
                <h1>Log<span>Score</span></h1>
                <div class="subtitle">Diario Financiero</div>
            </div>

            <p>Un diario financiero que no confía en lo que prometes, sino en lo que demuestras.</p>

            <div class="team-tag">
                <strong>Equipo:</strong> ITICsLab
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="loadScreen(currentScreen + 1)">
                    ▶ Siguiente
                </button>
                <button class="btn btn-ghost" onclick="loadScreen(currentScreen - 1)">
                    ◀ Anterior
                </button>
                <button class="btn btn-ghost" onclick="resetDemo()">
                    ↺ Reiniciar
                </button>
            </div>

            <div class="screen-selector" id="screenSelector">
                <!-- generados por JS -->
            </div>
        </div>

        <!-- Marco del teléfono -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe id="appScreen" src="mobile-app-mockup/page1.html" scrolling="no" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/viewer.js"></script>

</body>

</html>
