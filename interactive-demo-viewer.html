<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogScore — Demo Interactivo</title>
    <link rel="icon" type="image/png" href="assets/icon.ico">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/movile-viewer.css">
</head>

<body>
    <section class="hero">
        <!-- Info del producto -->
        <div class="info">
            <span class="badge">✦ Prototipo interactivo</span>
            <div>
                <h1>Log<span>Score</span></h1>
                <div class="subtitle">Diario Financiero</div>
            </div>

            <p>Un diario financiero que no confía en lo que prometes, sino en lo que demuestras.</p>

            <div class="team-tag">
                <strong>Equipo:</strong> ITICsLab
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="loadScreen(currentScreen + 1)">
                    ▶ Siguiente
                </button>
                <button class="btn btn-ghost" onclick="loadScreen(currentScreen - 1)">
                    ◀ Anterior
                </button>
                <button class="btn btn-ghost" onclick="resetDemo()">
                    ↺ Reiniciar
                </button>
            </div>

            <div class="screen-selector" id="screenSelector">
                <!-- generados por JS -->
            </div>
        </div>

        <!-- Recuadro blanco (antes marco del teléfono) -->
        <div class="screen-wrapper">
            <div class="phone-body">
                <span class="phone-btn phone-btn-power"></span>
                <span class="phone-btn phone-btn-volume"></span>
                <div class="screen-frame">
                    <!-- Barra de estado + notch de cámaras -->
                    <div class="status-bar">
                        <div class="status-left">
                            <span class="status-time">9:41</span>
                            <span class="status-icon">◈</span>
                            <span class="status-icon">✧</span>
                            <span class="status-dots">•••</span>
                        </div>
                        <div class="camera-notch">
                            <span class="camera-dot"></span>
                        </div>
                        <div class="status-icons">
                            <span class="status-signal">▂▄▆</span>
                            <span class="status-wifi">ᯤ</span>
                            <span class="status-battery">▮</span>
                        </div>
                    </div>
                    <iframe id="appScreen" src="mobile-app-mockup/page1.html" scrolling="no" loading="lazy"
                        style="background-color: blueviolet;"></iframe>
                    <!-- Barra de gestos inferior -->
                    <div class="gesture-bar"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/viewer.js"></script>

</body>

</html>
